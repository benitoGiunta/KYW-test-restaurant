<style>
/* Mise en page : en-tête + compteurs + filtres collants, puis sections par catégorie en liste de fiches */
:root{--bg:#f6f5f2;--surf:#fff;--fg:#1d1f24;--mute:#5d626c;--line:#dedbd4;--accent:#1f4fd8;--imp:#b4340f;--impbg:#fbe6de;--min:#5d626c;--minbg:#ebe9e4;--font:'Inter',system-ui,sans-serif;--disp:'Space Grotesk',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--surf:#1d2026;--fg:#ecebe7;--mute:#a3a8b2;--line:#33373f;--accent:#8fb0ff;--imp:#ff9d7a;--impbg:#3a2218;--min:#a3a8b2;--minbg:#2a2d34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--surf:#1d2026;--fg:#ecebe7;--mute:#a3a8b2;--line:#33373f;--accent:#8fb0ff;--imp:#ff9d7a;--impbg:#3a2218;--min:#a3a8b2;--minbg:#2a2d34;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1080px;margin:0 auto}
h1{font:700 30px/1.15 var(--disp);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 24px;margin-bottom:20px}
.stats h3{font:600 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row b{font-weight:600}
.tot{font:700 44px/1 var(--disp);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-block:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:24px}
.bar label{display:flex;flex-direction:column;font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);gap:3px}
select{font:14px var(--font);padding:6px 8px;background:var(--surf);color:var(--fg);border:1px solid var(--line);border-radius:6px;min-width:150px}
#n{margin-left:auto;color:var(--mute);font-size:13px}
section{margin-bottom:36px}
section>h2{font:700 21px var(--disp);margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
section>h2 span{font:500 14px var(--font);color:var(--mute)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:1fr 200px;gap:16px}
.card>div{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;font-size:12px}
.tag{padding:2px 8px;border-radius:99px;background:var(--minbg);color:var(--fg)}
.g-important{background:var(--impbg);color:var(--imp);font-weight:600}
.g-mineur{color:var(--min)}
.card h4{font:600 16px/1.3 var(--font);margin:0 0 6px}
.card p{margin:0 0 6px}
.k{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pg{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.th{align-self:start}
.th img{width:100%;border:1px solid var(--line);border-radius:6px;display:block;cursor:zoom-in}
.th.none{font-size:12px;color:var(--mute)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain}
a:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:640px){.card{grid-template-columns:1fr}.th{max-width:280px}}
</style>

. Une fois en service, l’envoyer vaudra accord… »", "suggestion": "Relier le formulaire (mailto ou service d'envoi) ou le remplacer par les coordonnées directes et un lien mailto:info@bossime.be.", "restaurant": "atelier-de-bossime", "variante": "legacy", "img": "captures/atelier-de-bossime/legacy-01.webp"}, {"id": "legacy-02", "categorie": "disposition", "gravite": "mineur", "page": "toutes les pages", "viewport": "mobile", "titre": "Panneau du menu mobile décalé de son bord gauche", "description": "Une fois le menu ouvert à 390 px, le panneau est encadré d'un filet qui démarre sous l'en-tête et laisse un décalage de quelques pixels avec le bord de l'écran, ce qui donne un cadre mal aligné par rapport au reste de la page.", "preuve": "Capture 390 px, menu ouvert, haut de page d'accueil", "suggestion": "Aligner le panneau sur la largeur de l'écran (left: 0, pas de bordure latérale) ou sur les gouttières de l'en-tête.", "restaurant": "atelier-de-bossime", "variante": "legacy", "img": "captures/atelier-de-bossime/legacy-02.webp"}, {"id": "legacy-03", "categorie": "contenu", "gravite": "mineur", "page": "/atelier-de-bossime/legacy/notre-carte/", "viewport": "les deux", "titre": "Ligne « Menu jeune gastronome » : « sans accord » et « non » ambigus", "description": "Dans les colonnes Accord et Sans alcool, la ligne affiche « sans accord » puis « non » à la place d'un prix ; le « non » seul, sous « Sans alcool », se lit mal et n'est pas formulé comme les autres lignes.", "preuve": "« sans accord » / « non »", "suggestion": "Remplacer par un tiret ou une phrase unique : « Pas d'accord proposé ».", "restaurant": "atelier-de-bossime", "variante": "legacy", "img": "captures/atelier-de-bossime/legacy-03.webp"}, {"id": "portfolio-01", "categorie": "animation", "gravite": "important", "page": "/atelier-de-bossime/portfolio/", "viewport": "les deux", "titre": "Écran quasi vide pendant trois secondes à chaque page", "description": "À l'ouverture de n'importe quelle page, le titre, sktop) pour le sous-titre ; 10,04 px pour les puces de la roue sur /.", "suggestion": "Porter ces textes à 11 ou 12 px minimum.", "restaurant": "atelier-de-bossime", "variante": "portfolio", "img": "captures/atelier-de-bossime/portfolio-03.webp"}, {"id": "portfolio-04", "categorie": "contenu", "gravite": "mineur", "page": "/atelier-de-bossime/portfolio/histoire/", "viewport": "les deux", "titre": "Même portrait du chef utilisé deux fois sur la page Histoire", "description": "Le portrait de Ludovic Vanackere ouvre la page, puis revient identique dans la galerie « En cuisine, en salle et au bar ». La répétition se voit au défilement.", "preuve": "Même cadrage et mêmes vêtements dans les deux blocs, page /histoire/.", "suggestion": "Remplacer l'une des deux occurrences par une autre photo du dossier (cuisine ou salle).", "restaurant": "atelier-de-bossime", "variante": "portfolio", "img": "captures/atelier-de-bossime/portfolio-04.webp"}, {"id": "portfolio-05", "categorie": "langue", "gravite": "mineur", "page": "toutes les pages (pied de page, accueil, réservation)", "viewport": "les deux", "titre": "Heures écrites « 12:00 à 16:00 » au lieu de « 12 h 00 à 16 h 00 »", "description": "Les horaires utilisent le format informatique avec deux-points, alors que la typographie française écrit « 12 h » ou « 12 h 00 ». Visible dans chaque pied de page et dans le bloc d'ouverture.", "preuve": "« LUNDI AU VENDREDI 12:00 à 16:00 / 19:00 à 23:30 ; SAMEDI 19:00 à 23:30 »", "suggestion": "Afficher « 12 h – 16 h » et « 19 h – 23 h 30 » (adapter aussi le JSON-LD si besoin, qui peut garder le format ISO).", "restaurant": "atelier-de-bossime", "variante": "portfolio", "img": "captures/atelier-de-bossime/portfolio-05.webp"}, {"id": "awwwards-01", "categorie": "fonctionnel", "gravite": "mineur", "page": "/brasserie-du-quai/awwwards/", "viewport": "les deux", "titre": "Deux pieds de page de premier niveau sur chaque page", "description": "Le pied du site et celui de KYW sont deux blocs conte const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function fill(id,label,map){const s=$(id);s.append(new Option(label,''));for(const k in map)s.append(new Option(map[k],k));s.onchange=render}

function count(arr,key,map){const h=el('div');const m={};arr.forEach(p=>m[p[key]]=(m[p[key]]||0)+1);
 Object.keys(map).forEach(k=>{const r=el('div','row');r.append(el('span',0,map[k]),el('b',0,m[k]||0));h.append(r)});return h}
function render(){
 const f=D.filter(p=>(!$('#fr').value||p.restaurant==$('#fr').value)&&(!$('#fv').value||p.variante==$('#fv').value)&&(!$('#fg').value||p.gravite==$('#fg').value));

 const t=el('div');t.append(el('h3',0,'Total'),el('div','tot',f.length));st.append(t);
 [['Catégorie','categorie',Object.fromEntries(CAT)],['Gravité','gravite',GRA],['Restaurant','restaurant',REST],['Type de site','variante',VAR]].forEach(([h,k,m])=>{const d=el('div');d.append(el('h3',0,h),count(f,k,m));st.append(d)});
 const L=$('#list');L.replaceChildren();
 CAT.forEach(([k,lab])=>{const items=f.filter(p=>p.categorie==k).sort((a,b)=>(a.gravite=='important'?0:1)-(b.gravite=='important'?0:1));if(!items.length)return;
