<style>
  :root{
    --ink:#2B2620;
    --accent:#A8632F;
    --accent-soft:#F1E4D3;
    --muted:#8A7F71;
    --rule:#E6DDD0;
    --bg:#FBF8F4;
    --card:#FFFFFF;
    --closed:#C9C0B2;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding:52px 24px 28px;
    text-align:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(168,99,47,0.08), transparent 45%),
      radial-gradient(circle at 85% 0%, rgba(168,99,47,0.06), transparent 40%);
  }
  .hero .mark{
    font-family:'Lora',serif;
    font-weight:700;
    font-size:clamp(34px,9vw,46px);
    letter-spacing:4px;
    margin:0;
  }
  .hero .dots{color:var(--accent);letter-spacing:6px;margin:8px 0;font-size:13px;}
  .hero .tag{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 18px;
  }
  .status-row{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .status-pill{
    font-size:11.5px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--rule);
    color:var(--muted);
    background:var(--card);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .status-pill.live{color:#3E7A4E;border-color:#CFE4D4;background:#F2F8F3;}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--closed);}
  .status-pill.live .dot{background:#3E7A4E;box-shadow:0 0 0 3px rgba(62,122,78,0.18);}

  /* ---------- SEARCH ---------- */
  .search-wrap{
    padding:0 20px;
    max-width:640px;
    margin:18px auto 0;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:12px 16px;
  }
  .search-box svg{flex:none;opacity:.5;}
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    font-family:'Poppins',sans-serif;
    font-size:15px;
    width:100%;
    color:var(--ink);
  }
  .search-box input::placeholder{color:var(--muted);}

  /* ---------- NAV ---------- */
  nav.tabs{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(251,248,244,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
    padding:12px 16px;
    margin-top:20px;
  }
  .tabs-inner{
    display:flex;
    gap:8px;
    overflow-x:auto;
    max-width:680px;
    margin:0 auto;
    scrollbar-width:none;
  }
  .tabs-inner::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none;
    font-family:'Poppins',sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  /* ---------- LAYOUT ---------- */
  main{max-width:680px;margin:0 auto;padding:0 20px;}
  .macro{
    padding-top:38px;
    scroll-margin-top:78px;
  }
  .macro-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:6px;
  }
  .macro-head h2{
    font-family:'Lora',serif;
    font-size:26px;
    margin:0;
  }
  .macro-time{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.5px;
  }
  .macro-intro{
    color:var(--muted);
    font-size:13.5px;
    margin:0 0 18px;
  }

  .section{margin-top:26px;scroll-margin-top:78px;}
  .section h3{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 4px;
  }
  .section .sub{
    font-size:11.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0 0 10px;
  }
  .section hr{border:none;border-top:1px solid var(--rule);margin:0 0 12px;}

  .item{
    padding:10px 0;
    border-bottom:1px dashed var(--rule);
  }
  .item:last-child{border-bottom:none;}
  .item-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .item-name{
    font-weight:500;
    font-size:15px;
    flex:1;
  }
  .item-price{
    font-weight:600;
    color:var(--accent);
    font-size:14.5px;
    white-space:nowrap;
  }
  .item-desc{
    font-size:12.5px;
    color:var(--muted);
    font-style:italic;
    margin-top:3px;
    line-height:1.4;
  }
  .item.hidden{display:none;}
  .section.hidden{display:none;}

  .note{
    text-align:center;
    font-size:12px;
    font-style:italic;
    color:var(--muted);
    margin:16px 0 0;
  }

  footer{
    max-width:680px;
    margin:56px auto 0;
    padding:22px 20px;
    text-align:center;
    border-top:1px solid var(--rule);
    color:var(--muted);
    font-size:12px;
  }
  footer b{color:var(--ink);}

  #no-results{
    display:none;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:60px 20px;
  }
</style>
</head>

// Build status pills (live open/closed for time-gated macro categories)
const now = new Date();
const hourFloat = now.getHours() + now.getMinutes()/60;
DATA.filter(m => m.time).forEach(m => {
  const live = hourFloat >= m.start && hourFloat < m.end;
  const pill = document.createElement('span');
  pill.className = 'status-pill' + (live ? ' live' : '');
  pill.innerHTML = `<span class="dot"></span>${m.label} · ${m.time}`;
  statusRow.appendChild(pill);
});

// Build tabs
DATA.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
  btn.textContent = m.label;
  btn.dataset.target = m.id;
  btn.addEventListener('click', () => {
    document.getElementById(m.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  tabsInner.appendChild(btn);
});

// Build sections
DATA.forEach(m => {
  const macro = document.createElement('section');
  macro.className = 'macro';
  macro.id = m.id;

  const head = document.createElement('div');
  head.className = 'macro-head';
  head.innerHTML = `<h2>${m.title}</h2>` + (m.time ? `<span class="macro-time">${m.time}</span>` : '');
  macro.appendChild(head);

  m.sections.forEach(sec => {
    const s = document.createElement('div');
    s.className = 'section';
    s.dataset.name = sec.name.toLowerCase();
    s.innerHTML = `<h3>${sec.name}</h3>` +
      (sec.sub ? `<p class="sub">${sec.sub}</p>` : '') +
      `<hr>`;
    sec.items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.name = it.n.toLowerCase();
      row.innerHTML = `<div class="item-row"><span class="item-name">${it.n}</span>` +
        (it.p ? `<span class="item-price">${it.p}</span>` : '') + `</div>` +
        (it.d ? `<div class="item-desc">${it.d}</div>` : '');
      s.appendChild(row);
    });
    if (sec.note) {
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = sec.note;
      s.appendChild(note);
    }
    macro.appendChild(s);
  });

  main.appendChild(macro);
});

// Active tab on scroll
const tabBtns = [...tabsInner.querySelectorAll('.tab-btn')];
const macros = [...document.querySelectorAll('.macro')];
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.target === e.target.id));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
macros.forEach(m => io.observe(m));

// Search
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.section').forEach(sec => {
    let sectionHasMatch = false;
    sec.querySelectorAll('.item').forEach(item => {
      const match = !q || item.dataset.name.includes(q);
      item.classList.toggle('hidden', !match);
      if (match) sectionHasMatch = true;
    });
    sec.classList.toggle('hidden', !sectionHasMatch);
    if (sectionHasMatch) anyVisible = true;
  });
  noResults.style.display = anyVisible ? 'none' : 'block';
});
</script>
</body>
</html>
