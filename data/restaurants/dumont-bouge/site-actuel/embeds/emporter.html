<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagobert — La Carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2620;
    --accent:#A8632F;
    --accent-soft:#F1E4D3;
    --muted:#8A7F71;
    --rule:#E6DDD0;
    --bg:#FBF8F4;
    --card:#FFFFFF;
    --closed:#C9C0B2;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding:52px 24px 28px;
    text-align:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(168,99,47,0.08), transparent 45%),
      radial-gradient(circle at 85% 0%, rgba(168,99,47,0.06), transparent 40%);
  }
  .hero .mark{
    font-family:'Lora',serif;
    font-weight:700;
    font-size:clamp(34px,9vw,46px);
    letter-spacing:4px;
    margin:0;
  }
  .hero .dots{color:var(--accent);letter-spacing:6px;margin:8px 0;font-size:13px;}
  .hero .tag{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 18px;
  }
  .status-row{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .status-pill{
    font-size:11.5px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--rule);
    color:var(--muted);
    background:var(--card);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .status-pill.live{color:#3E7A4E;border-color:#CFE4D4;background:#F2F8F3;}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--closed);}
  .status-pill.live .dot{background:#3E7A4E;box-shadow:0 0 0 3px rgba(62,122,78,0.18);}

  /* ---------- SEARCH ---------- */
  .search-wrap{
    padding:0 20px;
    max-width:640px;
    margin:18px auto 0;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:12px 16px;
  }
  .search-box svg{flex:none;opacity:.5;}
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    font-family:'Poppins',sans-serif;
    font-size:15px;
    width:100%;
    color:var(--ink);
  }
  .search-box input::placeholder{color:var(--muted);}

  /* ---------- NAV ---------- */
  nav.tabs{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(251,248,244,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
    padding:12px 16px;
    margin-top:20px;
  }
  .tabs-inner{
    display:flex;
    gap:8px;
    overflow-x:auto;
    max-width:680px;
    margin:0 auto;
    scrollbar-width:none;
  }
  .tabs-inner::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none;
    font-family:'Poppins',sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  /* ---------- LAYOUT ---------- */
  main{max-width:680px;margin:0 auto;padding:0 20px;}
  .macro{
    padding-top:38px;
    scroll-margin-top:78px;
  }
  .macro-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:6px;
  }
  .macro-head h2{
    font-family:'Lora',serif;
    font-size:26px;
    margin:0;
  }
  .macro-time{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.5px;
  }
  .macro-intro{
    color:var(--muted);
    font-size:13.5px;
    margin:0 0 18px;
  }

  .section{margin-top:26px;scroll-margin-top:78px;}
  .section h3{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 4px;
  }
  .section .sub{
    font-size:11.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0 0 10px;
  }
  .section hr{border:none;border-top:1px solid var(--rule);margin:0 0 12px;}

  .item{
    padding:10px 0;
    border-bottom:1px dashed var(--rule);
  }
  .item:last-child{border-bottom:none;}
  .item-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .item-name{
    font-weight:500;
    font-size:15px;
    flex:1;
  }
  .item-price{
    font-weight:600;
    color:var(--accent);
    font-size:14.5px;
    white-space:nowrap;
  }
  .item-desc{
    font-size:12.5px;
    color:var(--muted);
    font-style:italic;
    margin-top:3px;
    line-height:1.4;
  }
  .item.hidden{display:none;}
  .section.hidden{display:none;}

  .note{
    text-align:center;
    font-size:12px;
    font-style:italic;
    color:var(--muted);
    margin:16px 0 0;
  }

  footer{
    max-width:680px;
    margin:56px auto 0;
    padding:22px 20px;
    text-align:center;
    border-top:1px solid var(--rule);
    color:var(--muted);
    font-size:12px;
  }
  footer b{color:var(--ink);}

  .format-bar{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin:2px 0 16px;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .format-bar::-webkit-scrollbar{display:none;}
  .format-btn{
    flex:none;
    font-family:'Poppins',sans-serif;
    font-size:12px;
    font-weight:500;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .format-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .format-hint{
    font-size:12px;
    color:var(--muted);
    margin:0 0 10px;
  }
  .grid-item .item-price{transition:opacity .12s ease;}
  .supplement-row{border-top:1px solid var(--rule);margin-top:6px;padding-top:10px;}
  .supplement-row .item-name{font-style:italic;color:var(--muted);font-weight:400;font-size:13.5px;}

  #no-results{
    display:none;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:60px 20px;
  }
</style>
</head>
<body>

<div class="hero">
  <p class="dots">• • •</p>
  <h1 class="mark">DAGOBERT</h1>
  <p class="tag">Sandwichs · Salades · Paninis — à emporter</p>
  <div class="status-row" id="statusRow"></div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Chercher un plat, une boisson…">
  </div>
</div>

<nav class="tabs">
  <div class="tabs-inner" id="tabsInner"></div>
</nav>

<main id="main"></main>
<p id="no-results">Aucun résultat pour cette recherche.</p>

<footer>
  <b>Allergie alimentaire ?</b> Nous répondons à vos questions.<br>
  Tous nos sandwichs, salades et paninis sont préparés à la commande.
</footer>

<script>
const FORMATS = ["1/3 baguette", "1/2 baguette", "3/4 baguette", "Pistolet", "Sandwich"];
const DEFAULT_FORMAT = 1; // "1/2 baguette"

const DATA = [
  {
    id:"sandwichs", label:"Sandwichs", title:"Dagobert", time:null,
    sections:[
      {
        name:"Dagobert classique", sub:"À emporter — choisissez votre pain", type:"grid",
        items:[
          {n:"Jambon", prices:[3, 3.9, 5.7, 2.7, 2.7]},
          {n:"Fromage", prices:[3, 3.9, 5.7, 2.7, 2.7]},
          {n:"Jambon-fromage", prices:[3.5, 4.6, 6.9, 3.3, 3.3]},
          {n:"Poulet curry", prices:[3, 3.9, 5.7, 2.7, 2.7]},
          {n:"Poulet andalouse", prices:[3, 3.9, 5.7, 2.7, 2.7]},
          {n:"Crabe", prices:[3.4, 4.5, 6.4, 3.3, 3.3]},
          {n:"Thon", prices:[3.1, 4.1, 5.8, 3.1, 3.1]},
          {n:"Jambon de parme", prices:[3.2, 4.4, 6.8, 3.1, 3.1]},
          {n:"Parme-fromage", prices:[3.6, 4.7, 7.2, 3.3, 3.3]},
          {n:"Végétarien", prices:[2.8, 3.7, 5.5, 2.4, 2.4]},
          {n:"Végétalien", prices:[2.8, 3.7, 5.5, 2.4, 2.4]},
          {n:"Américain", prices:[3.3, 4.6, 6.9, 3.1, 3.1]},
          {n:"Fromage blanc", prices:[3, 3.9, 5.7, 2.7, 2.7]},
          {n:"Boulette", prices:[3.2, 4.8, 6.4, 3, 3]},
          {n:"Supplément crudités", prices:[0.9, 1.2, 1.6, 0.8, 0.8], supplement:true},
        ]
      },
      {
        name:"Dagobert spéciaux", sub:"À emporter",
        items:[
          {n:"Campagnard", p:"6,50 €", d:"Boulette, tomate, chou, carotte, œuf, roquette, sauce."},
          {n:"Créole", p:"6,50 €", d:"Poulet, tomate, chou, carotte, œuf, roquette, sauce."},
          {n:"Italien", p:"6,50 €", d:"Jambon de parme, tomate séchée, parmesan, roquette, balsamique."},
          {n:"Nordique", p:"6,00 €", d:"Thon, pêche, roquette."},
          {n:"Marine", p:"7,90 €", d:"Saumon, fromage blanc, tomate, roquette, vinaigrette."},
          {n:"Fraîcheur", p:"6,50 €", d:"Jambon, tomate, œuf, roquette, salade, parmesan, vinaigrette."},
          {n:"Normand", p:"6,70 €", d:"Brie, sirop de Liège, noix, raisins, roquette."},
          {n:"Napoli", p:"6,50 €", d:"Mozzarella, tomate, jambon de parme, roquette, crème balsamique, huile d'olive."},
          {n:"Fitness", p:"6,50 €", d:"Fromage blanc, jambon, roquette, chou, carotte."},
          {n:"Provençal", p:"6,50 €", d:"Tomatade, roquette, mozzarella, parmesan, poivron, aubergine, tomate, poulet grillé."},
          {n:"Sicilien", p:"6,50 €", d:"Tomatade, roquette, mozzarella, parmesan, poivron, aubergine, tomate."},
        ]
      },
    ]
  },
  {
    id:"salades", label:"Salades", title:"Les salades", time:null,
    sections:[
      { name:"Salades", sub:"À emporter", items:[
        {n:"Fraîcheur", p:"9,70 €", d:"Salade, œufs, tomate, chou, carotte, parmesan, jambon, vinaigrette."},
        {n:"Thon-pêche", p:"9,70 €", d:"Salade, œufs, tomate, chou, carotte, thon, pêche, vinaigrette."},
        {n:"Marine", p:"12,00 €", d:"Salade, œufs, tomate, chou, carotte, saumon, vinaigrette."},
        {n:"Hawaii", p:"9,70 €", d:"Salade, œufs, tomate, chou, carotte, poulet, ananas, sauce cocktail."},
        {n:"Boulette", p:"9,70 €", d:"Salade, œufs, tomate, chou, carotte, boulette, sauce au choix."},
        {n:"Italienne", p:"9,70 €", d:"Salade, œufs, tomate, chou, carotte, jambon de parme, tomate séchée, parmesan."},
      ]},
    ]
  },
  {
    id:"paninis", label:"Paninis", title:"Les paninis", time:null,
    sections:[
      { name:"Paninis", sub:"À emporter", items:[
        {n:"Panini croque", p:"5,90 €", d:"Jambon, fromage, beurre."},
        {n:"Italien", p:"6,90 €", d:"Jambon de parme, mozzarella, tomate séchées, pesto."},
      ]},
    ]
  },
];

const main = document.getElementById('main');
const tabsInner = document.getElementById('tabsInner');
const statusRow = document.getElementById('statusRow');

// Status pills only render for macro-categories with opening hours (none here)
const now = new Date();
const hourFloat = now.getHours() + now.getMinutes()/60;
DATA.filter(m => m.time).forEach(m => {
  const live = hourFloat >= m.start && hourFloat < m.end;
  const pill = document.createElement('span');
  pill.className = 'status-pill' + (live ? ' live' : '');
  pill.innerHTML = `<span class="dot"></span>${m.label} · ${m.time}`;
  statusRow.appendChild(pill);
});

// Build tabs
DATA.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
  btn.textContent = m.label;
  btn.dataset.target = m.id;
  btn.addEventListener('click', () => {
    document.getElementById(m.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  tabsInner.appendChild(btn);
});

function fmtPrice(v){
  return v.toFixed(2).replace('.', ',') + ' €';
}

function renderGridSection(sec){
  const s = document.createElement('div');
  s.className = 'section';
  s.dataset.name = sec.name.toLowerCase();

  s.innerHTML = `<h3>${sec.name}</h3>` + (sec.sub ? `<p class="sub">${sec.sub}</p>` : '') + `<hr>`;

  // format selector
  const bar = document.createElement('div');
  bar.className = 'format-bar';
  FORMATS.forEach((f, idx) => {
    const b = document.createElement('button');
    b.className = 'format-btn' + (idx === DEFAULT_FORMAT ? ' active' : '');
    b.textContent = f;
    b.dataset.idx = idx;
    b.addEventListener('click', () => {
      bar.querySelectorAll('.format-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      s.querySelectorAll('.grid-item').forEach(row => {
        const prices = JSON.parse(row.dataset.prices);
        row.querySelector('.item-price').textContent = fmtPrice(prices[idx]);
      });
    });
    bar.appendChild(b);
  });
  s.appendChild(bar);

  const hint = document.createElement('p');
  hint.className = 'format-hint';
  hint.textContent = 'Touchez un format de pain pour mettre les prix à jour.';
  s.appendChild(hint);

  sec.items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'item grid-item' + (it.supplement ? ' supplement-row' : '');
    row.dataset.name = it.n.toLowerCase();
    row.dataset.prices = JSON.stringify(it.prices);
    row.innerHTML = `<div class="item-row"><span class="item-name">${it.supplement ? '+ ' + it.n : it.n}</span>` +
      `<span class="item-price">${fmtPrice(it.prices[DEFAULT_FORMAT])}</span></div>`;
    s.appendChild(row);
  });

  return s;
}

function renderListSection(sec){
  const s = document.createElement('div');
  s.className = 'section';
  s.dataset.name = sec.name.toLowerCase();
  s.innerHTML = `<h3>${sec.name}</h3>` + (sec.sub ? `<p class="sub">${sec.sub}</p>` : '') + `<hr>`;
  sec.items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'item';
    row.dataset.name = it.n.toLowerCase();
    row.innerHTML = `<div class="item-row"><span class="item-name">${it.n}</span>` +
      (it.p ? `<span class="item-price">${it.p}</span>` : '') + `</div>` +
      (it.d ? `<div class="item-desc">${it.d}</div>` : '');
    s.appendChild(row);
  });
  if (sec.note) {
    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = sec.note;
    s.appendChild(note);
  }
  return s;
}

// Build sections
DATA.forEach(m => {
  const macro = document.createElement('section');
  macro.className = 'macro';
  macro.id = m.id;

  const head = document.createElement('div');
  head.className = 'macro-head';
  head.innerHTML = `<h2>${m.title}</h2>` + (m.time ? `<span class="macro-time">${m.time}</span>` : '');
  macro.appendChild(head);

  m.sections.forEach(sec => {
    const el = sec.type === 'grid' ? renderGridSection(sec) : renderListSection(sec);
    macro.appendChild(el);
  });

  main.appendChild(macro);
});

// Active tab on scroll
const tabBtns = [...tabsInner.querySelectorAll('.tab-btn')];
const macros = [...document.querySelectorAll('.macro')];
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.target === e.target.id));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
macros.forEach(m => io.observe(m));

// Search (grid rows match on name only; price text changes with format so we don't index it)
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.section').forEach(sec => {
    let sectionHasMatch = false;
    sec.querySelectorAll('.item').forEach(item => {
      const match = !q || item.dataset.name.includes(q);
      item.classList.toggle('hidden', !match);
      if (match) sectionHasMatch = true;
    });
    sec.classList.toggle('hidden', !sectionHasMatch);
    if (sectionHasMatch) anyVisible = true;
  });
  noResults.style.display = anyVisible ? 'none' : 'block';
});
</script>
</body>
</html>
