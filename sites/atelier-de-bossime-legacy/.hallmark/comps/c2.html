<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Grenze Gotisch";src:url(../../public/fonts/grenze-gotisch-600-latin.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Hanken Grotesk";src:url(../../public/fonts/hanken-grotesk-latin.woff2) format("woff2");font-weight:100 900}
</style>
<link rel="stylesheet" href="../../src/styles/tokens.css"><link rel="stylesheet" href="../../src/styles/base.css">
<style>
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:var(--rule-double) double var(--color-ink)}
.nav ul{display:flex;gap:var(--space-lg);list-style:none;margin:0;padding:0;font-weight:600}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 var(--space-lg);border:1px solid var(--color-ink);border-radius:2px;font-weight:500;text-decoration:none}
.btn--primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)}
</style></head><body>
<header class="container nav"><img src="../../public/photos/logo.png" width="150" alt="Bossimé"><ul><li>Notre cuisine</li><li>Notre carte</li><li>Contactez-nous</li><li><a class="btn btn--primary">Réserver</a></li></ul></header>
<section style="display:grid;grid-template-columns:5fr 7fr;height:calc(100dvh - 72px)">
<div style="padding:var(--space-3xl) var(--space-2xl) var(--space-2xl) var(--gutter);display:flex;flex-direction:column;justify-content:end">
<h1 style="font-size:6rem">Cuisine gastronomique issue du circuit court</h1>
<p class="lead" style="margin-top:var(--space-md)">Une ferme gastronomique à Loyers, aux portes de Namur : le menu suit le potager.</p>
<p style="margin-top:var(--space-lg);display:flex;gap:var(--space-md)"><a class="btn btn--primary">Réserver une table</a><a class="btn">Voir la carte</a></p>
</div>
<figure data-slot style="margin:0"><img src="../../public/photos/14-ferme-batiment-2000.webp" alt="" style="object-position:60% 50%"></figure>
</section></body></html>
