<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>c2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ultra&family=Chivo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
body{margin:0}.top{display:flex;justify-content:space-between;align-items:center;height:72px;padding-inline:var(--gutter);border-bottom:var(--rule-bar) solid var(--color-ink);font:700 var(--text-md) var(--font-body)}
.top b{font:400 1.6rem var(--font-display)}.top a.btn{background:var(--color-accent);color:var(--color-accent-ink);padding:12px 20px;border-radius:var(--radius-input);text-decoration:none}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);height:calc(100dvh - 72px);min-height:560px}
.txt{position:relative;display:grid;align-content:center;padding:var(--space-2xl) var(--gutter);isolation:isolate}
.txt::after{content:"";position:absolute;inset:0 0 0 auto;width:90px;background:radial-gradient(var(--color-accent) 3px,transparent 3.5px) 0 0/12px 12px;-webkit-mask:linear-gradient(270deg,#000,transparent);mask:linear-gradient(270deg,#000,transparent);z-index:-1}
.txt p{margin-top:var(--space-md)}.txt .btn{justify-self:start;margin-top:var(--space-lg);background:var(--color-accent);color:var(--color-accent-ink);padding:14px 24px;border-radius:var(--radius-input);font-weight:700;text-decoration:none}
.pic{background:var(--color-accent);padding:var(--space-xl);display:grid}.pic img{width:100%;height:100%;object-fit:cover;outline:1px solid var(--color-ink)}
</style></head><body><div class="top"><b>Makimono</b><a class="btn" href="#">Commander</a></div>
<section class="hero"><div class="txt"><h1>Des uramaki créatifs, faits avec amour</h1><p class="lead">Rolls, nigiri et poké bowls, sur place ou à emporter.</p><a class="btn" href="#">Commander en ligne</a></div><div class="pic"><img src="../../public/photos/13-nigiri-saumon-flambe.webp" alt="Nigiri de saumon flambés au chalumeau"></div></section></body></html>
