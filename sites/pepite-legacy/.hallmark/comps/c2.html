<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../src/styles/tokens.css"><link rel="stylesheet" href="../../src/styles/base.css"><style>
.hero{position:relative;min-height:100dvh;display:grid;color:var(--color-ink)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.7)}
.plate{position:relative;background:color-mix(in oklab,var(--color-paper) 82%,transparent);padding:var(--space-xl);max-width:34rem;border-radius:var(--radius-card)}
.plate p{margin:var(--space-md) 0 var(--space-lg)}.btn{display:inline-block;background:var(--color-accent);color:var(--color-accent-ink);padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:500}

.hero{align-items:center;justify-items:end;padding:var(--gutter)}.plate{background:none;padding:0;max-width:30rem}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,var(--color-paper) 0,transparent 70%)}.plate{z-index:2}</style></head><body><section class="hero"><img src="../../public/photos/bouteilles.webp" alt=""><div class="plate"><h1>Pépite, cave à manger</h1><p class="lead">Des vins d’auteurs et des assiettes à partager, rue Notre-Dame à Namur.</p><a class="btn" href="#">Réserver une table</a></div></section></body></html>
